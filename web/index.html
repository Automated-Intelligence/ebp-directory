<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EBP Directory — Evidence-Based Therapies &amp; Interventions</title>
<style>
  :root {
    --bg: #f7f7f4; --card: #ffffff; --ink: #2d3436; --muted: #6b7280;
    --accent: #2f6f5e; --accent-soft: #e3efeb; --border: #e5e7eb;
    --well: #2f6f5e; --supported: #4a8fbf; --promising: #b8860b;
    --experimental: #8b7fb8; --listed: #9ca3af; --caution: #c0564f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--accent); color: #fff; padding: 1.4rem 1.5rem 1.1rem; }
  header h1 { margin: 0 0 .2rem; font-size: 1.45rem; font-weight: 600; }
  header p { margin: 0; opacity: .85; font-size: .9rem; }
  .wrap { max-width: 1050px; margin: 0 auto; padding: 0 1rem; }
  .searchbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 1rem 0 .6rem; }
  #q { width: 100%; padding: .75rem 1rem; font-size: 1.05rem; border: 1.5px solid var(--border); border-radius: 10px; background: var(--card); }
  #q:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .filters { display: flex; flex-wrap: wrap; gap: .4rem; padding: .5rem 0 .2rem; }
  .filters select { padding: .4rem .5rem; border: 1px solid var(--border); border-radius: 8px; background: var(--card); font-size: .85rem; max-width: 200px; color: var(--ink); }
  .count { font-size: .8rem; color: var(--muted); padding: .3rem 0 .5rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: .9rem 1.1rem; margin-bottom: .6rem; cursor: pointer; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.07); }
  .card h3 { margin: 0 0 .3rem; font-size: 1.05rem; }
  .aka { color: var(--muted); font-size: .8rem; margin-left: .4rem; font-weight: 400; }
  .badges { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .35rem; }
  .badge { font-size: .72rem; padding: .15rem .55rem; border-radius: 999px; color: #fff; letter-spacing: .02em; }
  .badge.outline { color: var(--muted); background: transparent; border: 1px solid var(--border); }
  .tier-well-supported { background: var(--well); }
  .tier-supported { background: var(--supported); }
  .tier-promising { background: var(--promising); }
  .tier-experimental { background: var(--experimental); }
  .tier-listed { background: var(--listed); }
  .tier-caution, .tier-not-supported { background: var(--caution); }
  .detail { display: none; margin-top: .8rem; border-top: 1px solid var(--border); padding-top: .8rem; cursor: auto; }
  .card.open .detail { display: block; }
  .detail p.summary { margin: .2rem 0 .8rem; font-size: .92rem; line-height: 1.5; }
  .caution-note { background: #fdf0ef; border: 1px solid #f0cfcc; color: #8c3b35; border-radius: 8px; padding: .5rem .8rem; font-size: .85rem; margin-bottom: .7rem; }
  table.evidence { width: 100%; border-collapse: collapse; font-size: .85rem; }
  table.evidence th, table.evidence td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.evidence th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
  .evwrap { overflow-x: auto; }
  a { color: var(--accent); }
  .links { margin-top: .6rem; font-size: .85rem; }
  footer { margin: 2.5rem 0 1.5rem; font-size: .78rem; color: var(--muted); line-height: 1.6; }
  .pill-caution { display:inline-block; margin-left:.4rem; color: var(--caution); font-size:.75rem; }
  #loaderr { display:none; background:#fff8e6; border:1px solid #eadfb8; padding:1rem; border-radius:10px; margin-top:1rem; font-size:.9rem; }
  @media (max-width: 640px) { header h1 { font-size: 1.2rem; } .filters select { max-width: 47%; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>EBP Directory</h1>
    <p>Evidence-based therapies &amp; interventions, cross-referenced from major registries</p>
  </div>
</header>
<div class="wrap">
  <div class="searchbar">
    <input id="q" type="search" placeholder="Search by therapy, problem, or population — e.g. “adolescent trauma” or “TF-CBT”" autofocus>
    <div class="filters">
      <select id="f-tier"><option value="">Evidence tier</option></select>
      <select id="f-problem"><option value="">Problem area</option></select>
      <select id="f-population"><option value="">Population</option></select>
      <select id="f-modality"><option value="">Modality</option></select>
      <select id="f-source"><option value="">Registry</option></select>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div id="loaderr">Couldn't load the dataset. If you opened this file directly, run <code>npm run serve</code> (or <code>python -m http.server</code>) from the project folder and open the printed URL.</div>
  <div id="results"></div>
  <footer id="foot"></footer>
</div>
<script src="vendor/fuse.min.js"></script>
<script src="app.js"></script>
</body>
</html>
