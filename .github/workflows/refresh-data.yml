name: Quarterly data refresh

on:
  schedule:
    - cron: "0 6 1 1,4,7,10 *" # 06:00 UTC on the 1st of Jan/Apr/Jul/Oct
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh dataset
        run: python scripts/refresh.py

      - name: Open PR with changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data-refresh
          title: "Quarterly data refresh"
          commit-message: "Refresh registry data"
          body-path: data/CHANGES.md
          add-paths: |
            data/
            web/data/
